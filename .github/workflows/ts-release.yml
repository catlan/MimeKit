# Publishes the `mimekit-ts` package (in ts/) to npm via trusted publishing: GitHub's
# OIDC token authenticates to the registry, so there is no NPM_TOKEN secret to store or
# rotate, and npm attaches a provenance attestation automatically (no --provenance flag).
#
# Requires a trusted publisher registered on npmjs.com for this repo and this filename,
# and `id-token: write` below — without that permission the OIDC exchange cannot happen.
#
# Fires on the release tags the README prescribes (ts/v1.2.3 — prefixed so upstream
# MimeKit's C# `release.yml`, which triggers on '*', never matches: * does not cross /).
# The whole differential suite runs first; a release that cannot pass its own gates is
# not a release.
name: ts-release

on:
  push:
    tags: ['ts/v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      # Trusted publishing needs npm >= 11.5.1; don't rely on what Node bundles.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/ts/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag ts/v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
      - run: pnpm run typecheck
      - run: pnpm run check:readme
      - name: Generate C# oracle outputs
        run: node gates/oracle-gen.mjs
      - run: pnpm test
      # `prepack` syncs the README from the repo root and builds dist/.
      - run: npm publish
