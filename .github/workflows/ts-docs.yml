# Builds the TypeDoc API docs for the `mimekit` package (in ts/) and deploys them
# to GitHub Pages. All work happens inside ts/; only this workflow lives at the repo
# root (GitHub requires workflow files there). Enable Pages once in the repo settings:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: ts-docs

on:
  push:
    branches: [ts-port, main, master]
    paths: ['ts/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires node:sqlite, which Node 20 does not ship.
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ts/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
